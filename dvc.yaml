stages:
  data_ingestion:
    cmd: uv run python src/data_ingestion.py
    deps:
    - src/data_ingestion.py
    outs:
    - data/raw
  data_cleaning:
    cmd: uv run python src/data_cleaning.py
    deps:
    - data/raw
    - src/data_cleaning.py
    outs:
    - data/processed
  feature_engineering:
    cmd: uv run python src/feature_engineering.py
    deps:
    - data/processed
    - src/feature_engineering.py
    params:
    - feature_engineering.test_size
    outs:
    - data/features
  model_building:
    cmd: uv run python src/model_building.py
    deps:
    - data/features
    - src/model_building.py
    # params:
    # - model_building.max_depth
    # - model_building.n_estimators
    outs:
    - best_rf_model.pkl
  model_evaluation:
    cmd: uv run python src/model_evaluation.py
    deps:
    - data/features
    - best_rf_model.pkl
    - power_transformer.pkl
    - src/model_evaluation.py
    metrics:
    - metrics.json
