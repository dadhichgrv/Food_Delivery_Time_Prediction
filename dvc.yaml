stages:
  data_ingestion:
    cmd: uv run python src/01.data_ingestion.py
    deps:
    - src/01.data_ingestion.py
    outs:
    - data/cleaned
  data_cleaning:
    cmd: uv run python src/02.data_cleaning.py
    deps:
    - data/cleaned
    - src/02.data_cleaning.py
    outs:
    - data/processed
  feature_engineering:
    cmd: uv run python src/03.feature_engineering.py
    deps:
    - data/processed
    - src/03.feature_engineering.py
    params:
    - feature_engineering.test_size
    outs:
    - data/features
    - models/preprocessor.joblib
    - power_transformer.pkl
  model_building:
    cmd: uv run python src/04.model_building.py
    deps:
    - data/features
    - src/04.model_building.py
    params:
    - model_building
    # - model_building.n_estimators
    outs:
    - models/random_forest.joblib
  model_evaluation:
    cmd: uv run python src/05.model_evaluation.py
    deps:
    - data/features
    - models/random_forest.joblib
    - power_transformer.pkl
    - src/05.model_evaluation.py
    metrics:
    - run_information.json
  model_registry:
    cmd: uv run python src/06.model_registry.py
    deps:
    - src/06.model_registry.py
    - run_information.json

